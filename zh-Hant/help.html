<body><div class="page"><div class="container narrow"><header class="topbar"><a class="brand" href="index.html"><img src="../favicon/apple-touch-icon.png" alt=""><span>QR Tools</span></a><nav class="nav"><a href="index.html">首頁</a><a href="help.html">說明</a><a href="support.html">支援</a><a href="privacy-policy.html">隱私</a><a href="../index.html">English</a></nav></header><main class="article"><h1>說明</h1><section><h2>啟用 Safari 擴充功能</h2><p>開啟 QR Tools，進入 Safari 設定，然後在 Safari 擴充功能中啟用 QR Tools。</p></section><section><h2>生成目前網頁 QR Code</h2><p>開啟 Safari 或 Chrome 中要分享的頁面，再從瀏覽器工具列開啟 QR Tools。目前頁面 URL 會自動填入。</p></section><section><h2>編輯、清理、複製或儲存</h2><p>生成前可以編輯內容，使用清理 URL 移除常見追蹤參數，然後複製 QR 圖片或儲存 PNG。</p></section></main></div></div></body>
